# Clean Energy Capital Stack Tool — automatic build
#
# WHY THIS EXISTS
# index.html does not read data/*.json at runtime. It carries an inline copy.
# This workflow keeps the copy in sync so nobody has to remember a terminal
# step after editing through the CMS.
#
# WHAT IT DOES
#   1. Fires whenever anything under data/ changes on main — including the
#      commits the CMS makes on your behalf.
#   2. Runs scripts/build.js, which pushes data/ into index.html.
#   3. Commits index.html back to main. GitHub Pages redeploys on its own.
#
# FIRST RUN ONLY
# Go to the Actions tab, pick "Build site from data", click "Run workflow",
# and set "run_migration" to true. That runs scripts/tag-college.js once to
# tag the college programs. Leave it false every time after that.

name: Build site from data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build.js'
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Also run scripts/tag-college.js (one time only)'
        type: boolean
        default: false

permissions:
  contents: write

# If two CMS saves land close together, let the later one finish rather than
# racing the earlier one.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tag college programs (one-time migration)
        if: ${{ inputs.run_migration == true }}
        run: node scripts/tag-college.js

      - name: Push data into index.html
        run: node scripts/build.js

      - name: Commit the result
        run: |
          git config user.name  "capital-stack-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "Nothing changed — index.html was already in sync."
            exit 0
          fi
          git add data/ index.html
          git commit -m "Rebuild index.html from data/ [skip ci]"
          git push
