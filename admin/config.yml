backend:
  name: github
  # REQUIRED — fill in before this works.
  # Format: your-github-username-or-org/repo-name
  repo: ryan-wolfe-illinois/clean-energy-capital-stack-tool
  branch: main
  # REQUIRED — the address of the small OAuth helper described in SETUP.md.
  # Decap calls "<base_url>/auth" and "<base_url>/callback" to sign people in
  # with GitHub. Leave this pointed at the placeholder until the Cloudflare
  # Worker is deployed (step 4 in SETUP.md).
  base_url: https://REPLACE-WITH-YOUR-WORKER.workers.dev

# No image/file uploads in this tool, so no media_folder is needed.

# IMPORTANT — after any edit made here, someone must run `node scripts/build.js`
# and commit index.html. The site reads an inline copy of this data, not these
# JSON files. See scripts/build.js for why.

collections:
  - name: "programs"
    label: "Funding Programs"
    description: "Every program in the tool. Set Status to closed or paused instead of deleting a program that might come back. Programs still under review live in data/candidates.json and never show on the site."
    files:
      - name: "programs"
        label: "All Programs"
        file: "data/programs.json"
        fields:
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{fields.agency}} — {{fields.name}} ({{fields.status}})"
            fields:
              - { label: "Internal ID", name: "id", widget: "string", hint: "Lowercase, no spaces, unique (e.g. 'ihwap'). Leave alone once set." }
              - { label: "Agency / Source", name: "agency", widget: "string", hint: "Reuse an existing name exactly so the program groups with its agency on the network diagram." }
              - { label: "Program Name", name: "name", widget: "string" }
              - label: "Type"
                name: "kind"
                widget: "select"
                multiple: true
                options: ["Grant", "Loan", "Incentive/Rebate", "Tax", "Technical assistance", "Tool", "Credential", "Philanthropic"]
                hint: "One or more."
              - label: "Status"
                name: "status"
                widget: "select"
                default: "unverified"
                options: ["open", "rolling", "forthcoming", "paused", "closed", "unverified"]
                hint: "open = taking applications with a deadline. rolling = no deadline. forthcoming = announced, not open. paused = frozen or in litigation. closed = round ended. unverified = not yet checked."
              - { label: "Status Note", name: "statusNote", widget: "text", required: false, hint: "One line shown on the card under the status, e.g. 'FY26 round closed June 30, 2026.'" }
              - { label: "Deadline", name: "deadline", widget: "string", required: false, pattern: ['^(\d{4}-\d{2}-\d{2})?$', "Use YYYY-MM-DD or leave empty"] }
              - label: "Award Range"
                name: "award"
                widget: "object"
                fields:
                  - { label: "Minimum ($)", name: "min", widget: "number", value_type: "int", required: false }
                  - { label: "Maximum ($)", name: "max", widget: "number", value_type: "int", required: false }
              - { label: "Match Requirement", name: "match", widget: "string", required: false }
              - label: "Eligible Cost Types"
                name: "costTypes"
                widget: "select"
                multiple: true
                options: ["capital", "soft", "operating"]
              - { label: "Stacking Restrictions", name: "stacking", widget: "text", required: false }
              - { label: "Last Verified", name: "v", widget: "string", pattern: ['^\d{4}-\d{2}-\d{2}$', "Use YYYY-MM-DD"], hint: "The date you checked this program. Cards older than 90 days are flagged." }
              - { label: "Description", name: "detail", widget: "text", hint: "One or two sentences shown on the card. Say who is not eligible." }
              - label: "Funds These Project Types"
                name: "funds"
                widget: "select"
                multiple: true
                options:
                  - { label: "Energy efficiency upgrades", value: "ee" }
                  - { label: "Building electrification", value: "elec" }
                  - { label: "Solar installation", value: "solar" }
                  - { label: "Community solar", value: "csolar" }
                  - { label: "Predevelopment & soft costs", value: "predev" }
                  - { label: "Storage & resilience", value: "storage" }
                  - { label: "EV & fleet electrification", value: "ev" }
                  - { label: "Workforce & contractor capacity", value: "workforce" }
                  - { label: "New construction & code", value: "newcon" }
                  - { label: "Planning & organizational capacity", value: "plan" }
                  - { label: "General capital & construction", value: "capital" }
                  - { label: "Bioenergy & biomass", value: "bio" }
                  - { label: "Agriculture & food systems", value: "ag" }
                  - { label: "Industrial & manufacturing process", value: "industrial" }
                  - { label: "Wind, geothermal & district energy", value: "windgeo" }
                  - { label: "Waste, recycling & circular economy", value: "waste" }
                  - { label: "Brownfield & site remediation", value: "brownfield" }
                  - { label: "Freight, rail & logistics", value: "freight" }
                  - { label: "Operating & working capital", value: "operating" }
              - label: "Serves These Applicant Types"
                name: "serves"
                widget: "select"
                multiple: true
                options:
                  - { label: "Community-based organization", value: "cbo" }
                  - { label: "Municipality", value: "muni" }
                  - { label: "College or university", value: "college" }
                  - { label: "Small business owner", value: "smallbiz" }
                  - { label: "Contractor / EEC", value: "contractor" }
                  - { label: "Developer", value: "developer" }
                  - { label: "Resident / household", value: "resident" }
                  - { label: "University staff / other agency staff", value: "otheragency" }
                  - { label: "Agricultural producer or cooperative", value: "ag" }
                  - { label: "Manufacturer or industrial facility", value: "manufacturer" }
                  - { label: "School district, park district or housing authority", value: "district" }
                  - { label: "Faith-based institution", value: "faith" }
                  - { label: "Electric co-op or municipal utility", value: "utility" }
              - label: "Regions"
                name: "regions"
                widget: "select"
                multiple: true
                default: ["statewide"]
                options:
                  - { label: "Statewide", value: "statewide" }
                  - { label: "Central", value: "central" }
                  - { label: "East Central", value: "eastcentral" }
                  - { label: "North Central", value: "northcentral" }
                  - { label: "Northeast", value: "northeast" }
                  - { label: "Northern Stateline", value: "northernstateline" }
                  - { label: "Northwest", value: "northwest" }
                  - { label: "Southeastern", value: "southeastern" }
                  - { label: "Southern", value: "southern" }
                  - { label: "Southwestern", value: "southwestern" }
                  - { label: "West Central", value: "westcentral" }
              - label: "Links"
                name: "links"
                widget: "object"
                summary: "{{fields.hub.label}}"
                fields:
                  - label: "Hub Page (fallback everyone sees)"
                    name: "hub"
                    widget: "object"
                    fields:
                      - { label: "URL", name: "url", widget: "string", pattern: ['^https?://.+', "Full link starting with http:// or https://"] }
                      - { label: "Label", name: "label", widget: "string" }
                  - label: "Program Page (optional)"
                    name: "program"
                    widget: "object"
                    required: false
                    fields:
                      - { label: "URL", name: "url", widget: "string", required: false }
                      - { label: "Label", name: "label", widget: "string", required: false }
                  - label: "Audience-Specific Pages (optional)"
                    name: "audience"
                    widget: "list"
                    default: []
                    summary: "{{fields.label}}"
                    fields:
                      - label: "Applies To"
                        name: "tags"
                        widget: "select"
                        multiple: true
                        options:
                          - { label: "Community-based organization", value: "cbo" }
                          - { label: "Municipality", value: "muni" }
                          - { label: "College or university", value: "college" }
                          - { label: "Small business owner", value: "smallbiz" }
                          - { label: "Contractor / EEC", value: "contractor" }
                          - { label: "Developer", value: "developer" }
                          - { label: "Resident / household", value: "resident" }
                          - { label: "University staff / other agency staff", value: "otheragency" }
                          - { label: "Agricultural producer or cooperative", value: "ag" }
                          - { label: "Manufacturer or industrial facility", value: "manufacturer" }
                          - { label: "School district, park district or housing authority", value: "district" }
                          - { label: "Faith-based institution", value: "faith" }
                          - { label: "Electric co-op or municipal utility", value: "utility" }
                      - { label: "URL", name: "url", widget: "string", pattern: ['^https?://.+', "Full link starting with http:// or https://"] }
                      - { label: "Label", name: "label", widget: "string" }

  - name: "settings"
    label: "Site Settings"
    description: "Review date and out-of-scope referrals."
    files:
      - name: "settings"
        label: "Settings"
        file: "data/settings.json"
        fields:
          - { label: "Program data last reviewed", name: "verified_date", widget: "string", hint: "Plain text shown at the top and bottom of the page, e.g. October 8, 2026" }
          - label: "Referrals (shown when nothing fits)"
            name: "referrals"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Why", name: "why", widget: "text" }
