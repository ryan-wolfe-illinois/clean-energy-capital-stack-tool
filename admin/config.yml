backend:
  name: github
  # REQUIRED — fill in before this works.
  # Format: your-github-username-or-org/repo-name
  repo: YOUR-ORG/clean-energy-capital-stack-tool
  branch: main
  # REQUIRED — the address of the small OAuth helper described in SETUP.md.
  # Decap calls "<base_url>/auth" and "<base_url>/callback" to sign people in
  # with GitHub. Leave this pointed at the placeholder until the Cloudflare
  # Worker is deployed (step 4 in SETUP.md).
  base_url: https://REPLACE-WITH-YOUR-WORKER.workers.dev

# No image/file uploads in this tool, so no media_folder is needed.

# IMPORTANT — after any edit made here, someone must run `node scripts/build.js`
# and commit index.html. The site reads an inline copy of this data, not these
# JSON files. See scripts/build.js for why.

collections:
  - name: "programs"
    label: "Funding Programs"
    description: "Every program in the tool. Add one for a new program, edit one when a link or description changes. Use 'Not yet live' or 'Expired' under Status instead of deleting, if a program might come back."
    files:
      - name: "programs"
        label: "All Programs"
        file: "data/programs.json"
        fields:
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{fields.agency}} — {{fields.name}}"
            fields:
              - label: "Internal ID"
                name: "id"
                widget: "string"
                hint: "Lowercase, no spaces, must be unique (e.g. 'ihwap'). Only change this if you know a filter references it — safest to leave alone once set."

              - label: "Agency"
                name: "agency"
                widget: "string"
                hint: "Exactly as it should appear on the network diagram, e.g. 'DCEO', 'IFA Climate Bank', 'ComEd'. Reusing an existing agency name exactly, spelling and all, keeps that program grouped with the others from the same agency."

              - label: "Program Name"
                name: "name"
                widget: "string"

              - label: "Status"
                name: "kind"
                widget: "select"
                options:
                  - "Grant"
                  - "Loan"
                  - "Grant / Loan"
                  - "Grant / Loan guarantee"
                  - "Grant / Debt"
                  - "Grant / Pilot"
                  - "Grant / Workforce"
                  - "Debt"
                  - "Debt / Equity"
                  - "Tax credit"
                  - "Tax incentive"
                  - "Rebate"
                  - "Incentive"
                  - "Tariff"
                  - "Financing"
                  - "Technical assistance"
                  - "Direct install"
                  - "Workforce"
                  - "Credential"
                  - "Tool"
                  - "Policy"
                  - "Philanthropic"
                  - "Not yet live"
                  - "Expired"
                hint: "'Not yet live' and 'Expired' both still show in the tool, flagged, instead of disappearing — that is usually better than deleting."

              - label: "Application Link"
                name: "url"
                widget: "string"
                pattern: ['^https?://.+', "Must be a full link starting with http:// or https://"]

              - label: "Last Verified"
                name: "v"
                widget: "string"
                pattern: ['^(\d{4}-\d{2}-\d{2}|carry)$', "Use YYYY-MM-DD, e.g. 2026-09-04, or the word carry"]
                hint: "The date you personally checked this link and description were still accurate. 'carry' means it was brought over from an earlier version and has not been re-checked."

              - label: "Description"
                name: "detail"
                widget: "text"
                hint: "One or two sentences. This is what shows on the program's card. If a client type would be rejected on eligibility, say so here."

              - label: "Funds These Project Types"
                name: "funds"
                widget: "select"
                multiple: true
                options:
                  - { label: "Energy efficiency upgrades", value: "ee" }
                  - { label: "Building electrification", value: "elec" }
                  - { label: "Solar installation", value: "solar" }
                  - { label: "Community solar", value: "csolar" }
                  - { label: "Predevelopment & soft costs", value: "predev" }
                  - { label: "Storage & resilience", value: "storage" }
                  - { label: "EV & fleet electrification", value: "ev" }
                  - { label: "Workforce & contractor capacity", value: "workforce" }
                  - { label: "New construction & code", value: "newcon" }
                  - { label: "Planning & organizational capacity", value: "plan" }
                  - { label: "General capital & construction", value: "capital" }
                hint: "At least one. A program with none will never appear in results."

              - label: "Serves These Client Types"
                name: "serves"
                widget: "select"
                multiple: true
                options:
                  - { label: "Community-based organization", value: "cbo" }
                  - { label: "Municipality", value: "muni" }
                  - { label: "College or university", value: "college" }
                  - { label: "Small business owner", value: "smallbiz" }
                  - { label: "Contractor / EEC", value: "contractor" }
                  - { label: "Developer", value: "developer" }
                  - { label: "Resident / household", value: "resident" }
                hint: "At least one. Only tag a client type that could actually be the applicant or direct beneficiary — tagging one that would be rejected on eligibility points people at a dead end."

              - label: "Geographic Scope"
                name: "regions"
                widget: "select"
                multiple: true
                default: ["statewide"]
                options:
                  - { label: "Statewide", value: "statewide" }
                  - { label: "Central", value: "central" }
                  - { label: "East Central", value: "eastcentral" }
                  - { label: "North Central", value: "northcentral" }
                  - { label: "Northeast", value: "northeast" }
                  - { label: "Northern Stateline", value: "northernstateline" }
                  - { label: "Northwest", value: "northwest" }
                  - { label: "Southeastern", value: "southeastern" }
                  - { label: "Southern", value: "southern" }
                  - { label: "Southwestern", value: "southwestern" }
                  - { label: "West Central", value: "westcentral" }
                hint: "Select all regions where this program operates. Most are statewide; only a few are region-specific."

  - name: "settings"
    label: "Site Settings"
    description: "The one field to touch during the annual review pass."
    files:
      - name: "settings"
        label: "Verified Date"
        file: "data/settings.json"
        fields:
          - label: "Programs Verified As Of"
            name: "verified_date"
            widget: "string"
            hint: "Plain text, shown to visitors at the top and bottom of the page. Example: September 4, 2026"
